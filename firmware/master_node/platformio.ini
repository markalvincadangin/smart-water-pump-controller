; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.partitions = smartflow_ota.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

monitor_speed = 115200
upload_speed = 115200

; Pinned versions for build reproducibility (PRR Gate 3)
lib_deps =
  mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@4.4.17
  bblanchon/ArduinoJson@6.21.6
  arcao/Syslog@^2.0.0
  h2zero/NimBLE-Arduino@^1.4.1

; Pure C++ sources (no .ino compilation)
; Include recursively to pick up src/*/*.cpp
build_src_filter = +<**/*.cpp> -<**/*.ino>

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; upload_port should be passed dynamically or configured locally per dev, 
; e.g. upload_port = 192.168.1.100 or smartflow.local
; Keep the uploader callback on the Windows Firewall rule created for local OTA.
upload_flags =
  --host_port=20000
  --auth=${sysenv.SMARTFLOW_OTA_PASSWORD}
build_flags =
  -D ENABLE_OTA
  -D ENABLE_DEV_TCP_LOG=1
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

[env:esp32dev_usb_ota]
extends = env:esp32dev
build_flags =
  -D ENABLE_OTA
  -D ENABLE_DEV_TCP_LOG=1
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; Production-runtime validation target: OTA remains available for controlled
; updates, but the development TCP console is not compiled into the image.
[env:esp32dev_ota_production]
extends = env:esp32dev_ota
build_flags = -D ENABLE_OTA

; Development-only, one-time scoped reset. It preserves safety latches and
; configuration, clears only Wi-Fi enrollment, then starts BLE provisioning.
[env:esp32dev_ota_reprovision]
extends = env:esp32dev_ota
build_flags =
  -D ENABLE_OTA
  -D ENABLE_DEV_TCP_LOG=1
  -D SMARTFLOW_REPROVISION_REQUEST_ID=\"ota-reprovision-20260729-r16\"
