; PlatformIO Sensor Node (NodeMCU V2 / ESP8266)
;
; NOTE: NodeMCU uses UART0 (GPIO1/3) for RS-485 and USB flashing.
; Disconnect MAX485 from TX/RX during flashing, then reconnect.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

monitor_filters = send_on_enter

lib_deps =
  arcao/Syslog@^2.0.0

; Pure C++ sources (no .ino compilation)
; Exclude OTA implementation unless building nodemcuv2_ota (keeps Wi-Fi off flash/RAM).
build_src_filter = +<**/*.ino> +<**/*.cpp> -<**/ota_wifi_ota.cpp>

; Production default (RS-485 active).
; DEBUG_USB_MODE=0 keeps UART0 dedicated to RS-485.
; SENSOR_DEBUG_ENABLED can remain enabled because it logs on Serial1 (GPIO2 TX-only).
build_flags =
  -DDEBUG_USB_MODE=0
  -DSENSOR_DEBUG_ENABLED=1

[env:nodemcuv2_debug_usb]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_filters = send_on_enter
lib_deps =
  arcao/Syslog@^2.0.0
build_src_filter = +<**/*.ino> +<**/*.cpp> -<**/ota_wifi_ota.cpp>

; Single-USB bench debug mode:
; - routes logs to USB UART0
; - disables RS-485 slave traffic to prevent UART contention
build_flags =
  -DDEBUG_USB_MODE=1
  -DSENSOR_DEBUG_ENABLED=1

; Maintenance build: RS-485 + Wi-Fi + ArduinoOTA for wireless uploads.
; Requires src/config/secrets_ota.h (copy from secrets_ota.h.example).
; First flash this env over USB once, then use espota (see README).
[env:nodemcuv2_ota]
extends = env:nodemcuv2
; Link real OTA/Wi-Fi module instead of stubs.
build_src_filter = +<**/*.ino> +<**/*.cpp> -<**/ota_wifi_stubs.cpp>
build_flags = ${env:nodemcuv2.build_flags}
upload_protocol = espota
; `pio run -e nodemcuv2_ota` (compile only): override with a placeholder IP if your
; PlatformIO version requires upload_port for espota environments:
; upload_port = 192.168.1.1
; Wireless upload (required every time unless you set upload_port in this file):
;   pio run -e nodemcuv2_ota -t upload --upload-port 192.168.1.42
; mDNS (if your OS resolves it):
;   pio run -e nodemcuv2_ota -t upload --upload-port swpc-sensor-node.local

; Same firmware as nodemcuv2_ota, but upload over USB serial (use for the *first* OTA flash).
[env:nodemcuv2_ota_usb]
extends = env:nodemcuv2_ota
upload_protocol = esptool