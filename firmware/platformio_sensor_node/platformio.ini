; PlatformIO Sensor Node (NodeMCU V2 / ESP8266)
;
; NOTE: NodeMCU uses UART0 (GPIO1/3) for RS-485 and USB flashing.
; Disconnect MAX485 from TX/RX during flashing, then reconnect.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; Pure C++ sources (no .ino compilation)
; Include recursively to pick up src/*/*.cpp
build_src_filter = +<**/*.cpp> -<**/*.ino>

