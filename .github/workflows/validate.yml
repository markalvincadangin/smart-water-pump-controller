name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Create non-production Firebase configuration
        shell: bash
        run: |
          printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"smartflow-ci","storage_bucket":"smartflow-ci.invalid"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.smartflow"}},"api_key":[{"current_key":"ci-placeholder-not-a-secret"}]}],"configuration_version":"1"}' > app/google-services.json
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

  functions:
    name: Cloud Functions build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
