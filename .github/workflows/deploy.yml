# Production deployment pipeline — Test → Build → Deploy → Health check
# Requires: FIREBASE_TOKEN (or firebase login in CI), VERCEL_TOKEN and VERCEL_ORG/project (if using Vercel)
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Dashboard — test & validate
        run: |
          cd dashboard
          npm ci
          npm run test
          npm run lint
          npm run build
        # Full "npm run validate" includes lighthouse; use test + lint + build for CI speed.

      - name: Functions — test & build
        run: |
          cd functions
          npm ci
          npm run test
          npm run build

  deploy-firebase:
    name: Deploy Firebase (Rules + Functions)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase (database rules + functions)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only database,functions --non-interactive
        # If FIREBASE_TOKEN is not set, step will fail; add token in repo Secrets.

  deploy-dashboard:
    name: Deploy Dashboard (Vercel)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env and build (or deploy)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd dashboard
          npm ci
          npm run build
          vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        # Requires VERCEL_* secrets. Alternative: use Vercel GitHub integration (auto-deploy on push).

  health-check:
    name: Post-deploy health check
    needs: [deploy-firebase, deploy-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Check dashboard health
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://your-dashboard.vercel.app' }}
        run: |
          url="${DASHBOARD_URL%/}/api/health"
          echo "Pinging $url"
          resp=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
          if [ "$resp" = "503" ]; then
            echo "Health check FAILED: got 503 (Firebase not initialized or env missing)"
            exit 1
          fi
          if [ "$resp" != "200" ]; then
            echo "Health check returned HTTP $resp (expected 200)"
            exit 1
          fi
          echo "Health check OK: HTTP $resp"
        # Set DASHBOARD_URL in repo Variables (or Secrets) to your production dashboard URL.
